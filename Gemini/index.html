<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Overdrive: Modular Engine</title>
    <style>
        body { margin: 0; background: #050505; color: #0ff; font-family: 'Courier New', monospace; overflow: hidden; }
        canvas { display: block; filter: contrast(1.2) brightness(1.1); }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 0 0 10px #0ff; }
        .hud-val { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <div>HEALTH: <span id="hp" class="hud-val">100</span></div>
    <div>SCORE: <span id="score" class="hud-val">0</span></div>
    <div>WEAPON: <span id="weapon" class="hud-val">PISTOL</span></div>
</div>

<script>
/**
 * CENTRAL CONFIGURATION
 * Single source of truth for balancing.
 */
const CONFIG = {
    PLAYER: {
        SPEED: 4,
        HP: 100,
        RADIUS: 15,
        COLOR: '#00f2ff'
    },
    ENEMIES: {
        BASIC: { HP: 2, SPEED: 2, COLOR: '#ff0055', SCORE: 10, RADIUS: 12 },
        FAST: { HP: 1, SPEED: 4, COLOR: '#f0f', SCORE: 25, RADIUS: 8 }
    },
    WEAPONS: {
        PISTOL: { FIRE_RATE: 250, BULLET_SPEED: 10, DAMAGE: 1, COLOR: '#0ff' },
        SHOTGUN: { FIRE_RATE: 800, BULLET_SPEED: 8, DAMAGE: 1, SPREAD: 5, COLOR: '#ffea00' }
    },
    VISUALS: {
        GLOW: 15,
        PARTICLE_LIFE: 30,
        SHAKE_INTENSITY: 5
    }
};

/**
 * PUB-SUB EVENT BUS
 */
class EventBus {
    constructor() { this.listeners = {}; }
    on(event, callback) {
        if (!this.listeners[event]) this.listeners[event] = [];
        this.listeners[event].push(callback);
    }
    emit(event, data) {
        if (this.listeners[event]) this.listeners[event].forEach(cb => cb(data));
    }
}

const Bus = new EventBus();

/**
 * MATH & UTILS
 */
const Vec = {
    dist: (p1, p2) => Math.hypot(p2.x - p1.x, p2.y - p1.y),
    angle: (p1, p2) => Math.atan2(p2.y - p1.y, p2.x - p1.x)
};

/**
 * PARTICLE SYSTEM
 */
class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = CONFIG.VISUALS.PARTICLE_LIFE;
        this.color = color;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.life--;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life / CONFIG.VISUALS.PARTICLE_LIFE;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, 3, 3);
        ctx.globalAlpha = 1;
    }
}

/**
 * WEAPON REGISTRY & BASE CLASSES
 */
class Weapon {
    constructor(type) {
        this.config = CONFIG.WEAPONS[type];
        this.lastFire = 0;
        this.type = type;
    }
    canFire() { return Date.now() - this.lastFire > this.config.FIRE_RATE; }
    fire(player, target, spawnBulletFn) {
        if (!this.canFire()) return;
        this.executeFire(player, target, spawnBulletFn);
        this.lastFire = Date.now();
        Bus.emit('SCREEN_SHAKE', 2);
    }
}

class Pistol extends Weapon {
    executeFire(player, target, spawnBulletFn) {
        const angle = Vec.angle(player, target);
        spawnBulletFn(player.x, player.y, angle, this.config);
    }
}

class Shotgun extends Weapon {
    executeFire(player, target, spawnBulletFn) {
        const baseAngle = Vec.angle(player, target);
        for(let i = -1; i <= 1; i++) {
            const angle = baseAngle + (i * 0.2);
            spawnBulletFn(player.x, player.y, angle, this.config);
        }
    }
}

const WeaponRegistry = {
    'PISTOL': Pistol,
    'SHOTGUN': Shotgun
};

/**
 * ENEMY FACTORY
 */
class Enemy {
    constructor(x, y, type) {
        const cfg = CONFIG.ENEMIES[type];
        Object.assign(this, { x, y, ...cfg, type, dead: false });
    }
    update(player) {
        const angle = Vec.angle(this, player);
        this.x += Math.cos(angle) * this.speed;
        this.y += Math.sin(angle) * this.speed;
    }
    draw(ctx) {
        ctx.shadowBlur = CONFIG.VISUALS.GLOW;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

/**
 * CORE ENGINE
 */
class Engine {
    constructor() {
        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d');
        document.body.appendChild(this.canvas);
        
        this.state = 'PLAYING';
        this.entities = { player: null, enemies: [], bullets: [], particles: [] };
        this.input = { w: false, a: false, s: false, d: false, mouse: { x: 0, y: 0, down: false } };
        this.shake = 0;
        this.score = 0;

        this.init();
    }

    init() {
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Input Listeners
        window.addEventListener('keydown', e => this.input[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => this.input[e.key.toLowerCase()] = false);
        window.addEventListener('mousemove', e => { this.input.mouse.x = e.clientX; this.input.mouse.y = e.clientY; });
        window.addEventListener('mousedown', () => this.input.mouse.down = true);
        window.addEventListener('mouseup', () => this.input.mouse.down = false);

        // State Setup
        this.entities.player = { 
            x: this.canvas.width/2, 
            y: this.canvas.height/2, 
            hp: CONFIG.PLAYER.HP, 
            weapon: new WeaponRegistry['PISTOL']('PISTOL') 
        };

        // Event Bindings
        Bus.on('SCREEN_SHAKE', amt => this.shake = amt);
        
        this.loop();
        setInterval(() => this.spawnEnemy(), 2000);
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    spawnEnemy() {
        if (this.state !== 'PLAYING') return;
        const type = Math.random() > 0.8 ? 'FAST' : 'BASIC';
        const x = Math.random() > 0.5 ? -50 : this.canvas.width + 50;
        const y = Math.random() * this.canvas.height;
        this.entities.enemies.push(new Enemy(x, y, type));
    }

    update() {
        if (this.state !== 'PLAYING') return;

        const p = this.entities.player;

        // Player Movement
        if (this.input.w) p.y -= CONFIG.PLAYER.SPEED;
        if (this.input.s) p.y += CONFIG.PLAYER.SPEED;
        if (this.input.a) p.x -= CONFIG.PLAYER.SPEED;
        if (this.input.d) p.x += CONFIG.PLAYER.SPEED;

        // Combat
        if (this.input.mouse.down) {
            p.weapon.fire(p, this.input.mouse, (x, y, angle, cfg) => {
                this.entities.bullets.push({ x, y, angle, speed: cfg.bullet_speed, color: cfg.COLOR, dmg: cfg.DAMAGE });
            });
        }

        // Bullets
        this.entities.bullets.forEach((b, i) => {
            b.x += Math.cos(b.angle) * 10;
            b.y += Math.sin(b.angle) * 10;
            if (b.x < 0 || b.x > this.canvas.width || b.y < 0 || b.y > this.canvas.height) this.entities.bullets.splice(i, 1);
        });

        // Enemies & Collision
        this.entities.enemies.forEach((en, ei) => {
            en.update(p);
            
            // Bullet vs Enemy
            this.entities.bullets.forEach((b, bi) => {
                if (Vec.dist(en, b) < en.radius) {
                    en.hp -= b.dmg;
                    this.entities.bullets.splice(bi, 1);
                    for(let i=0; i<5; i++) this.entities.particles.push(new Particle(en.x, en.y, en.color));
                }
            });

            if (en.hp <= 0) {
                this.score += en.score;
                this.entities.enemies.splice(ei, 1);
                document.getElementById('score').innerText = this.score;
            }

            // Enemy vs Player
            if (Vec.dist(en, p) < CONFIG.PLAYER.RADIUS + en.radius) {
                p.hp -= 0.5;
                document.getElementById('hp').innerText = Math.floor(p.hp);
                this.shake = CONFIG.VISUALS.SHAKE_INTENSITY;
                if (p.hp <= 0) this.state = 'GAMEOVER';
            }
        });

        this.entities.particles.forEach((part, i) => {
            part.update();
            if (part.life <= 0) this.entities.particles.splice(i, 1);
        });

        if (this.shake > 0) this.shake *= 0.9;
    }

    draw() {
        // Neon Trail Effect: Don't clear fully
        this.ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        this.ctx.save();
        if (this.shake > 1) {
            this.ctx.translate(Math.random() * this.shake, Math.random() * this.shake);
        }

        const p = this.entities.player;
        
        // Draw Player
        this.ctx.shadowBlur = CONFIG.VISUALS.GLOW;
        this.ctx.shadowColor = CONFIG.PLAYER.COLOR;
        this.ctx.fillStyle = CONFIG.PLAYER.COLOR;
        this.ctx.beginPath();
        this.ctx.arc(p.x, p.y, CONFIG.PLAYER.RADIUS, 0, Math.PI * 2);
        this.ctx.fill();

        // Draw Entities
        this.entities.enemies.forEach(en => en.draw(this.ctx));
        this.entities.bullets.forEach(b => {
            this.ctx.fillStyle = b.color;
            this.ctx.fillRect(b.x, b.y, 4, 4);
        });
        this.entities.particles.forEach(part => part.draw(this.ctx));

        this.ctx.restore();

        if (this.state === 'GAMEOVER') {
            this.ctx.fillStyle = 'white';
            this.ctx.font = '48px Courier New';
            this.ctx.fillText('SYSTEM FAILURE', this.canvas.width/2 - 150, this.canvas.height/2);
        }
    }

    loop() {
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

const game = new Engine();
</script>
</body>
</html>
