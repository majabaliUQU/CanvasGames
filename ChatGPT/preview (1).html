<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Cyber Survival</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050816;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at center,#0a1028 0%,#050816 70%);
}

/* HUD */

#hud{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;
    pointer-events:none;
}

.hud-item{
    margin-bottom:10px;
    font-size:20px;
    color:#00ffff;
    text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff;
}

/* Menus */

.menu{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.hidden{
    display:none;
}

.title{
    font-size:72px;
    color:#00ffff;
    margin-bottom:40px;
    text-shadow:
        0 0 20px #00ffff,
        0 0 40px #00ffff;
}

.btn{
    padding:16px 32px;
    margin:10px;
    border:none;
    background:#00ffff;
    color:black;
    font-size:20px;
    cursor:pointer;
    border-radius:10px;
    transition:0.2s;
    font-weight:bold;
}

.btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #00ffff;
}

/* Entities */

.entity{
    position:absolute;
    will-change:transform;
}

.player{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#00ffff;
    box-shadow:
        0 0 20px #00ffff,
        0 0 40px #00ffff;
}

.enemy{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#ff0066;
    box-shadow:
        0 0 20px #ff0066,
        0 0 40px #ff0066;
}

.bullet{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ffff00;
    box-shadow:
        0 0 15px #ffff00,
        0 0 30px #ffff00;
}

.particle{
    border-radius:50%;
    pointer-events:none;
}

/* Damage flash */

.flash{
    animation:flash 0.15s;
}

@keyframes flash{
    from{ background:#ff0000; }
    to{ background:#050816; }
}

@media(max-width:700px){

    .title{
        font-size:42px;
    }

    .btn{
        width:220px;
    }
}

</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <div class="hud-item" id="score">Score: 0</div>
    <div class="hud-item" id="health">Health: 100</div>
    <div class="hud-item" id="wave">Wave: 1</div>
</div>

<!-- MAIN MENU -->
<div id="mainMenu" class="menu">
    <div class="title">CYBER SURVIVAL</div>
    <button class="btn" id="startBtn">START GAME</button>
</div>

<!-- PAUSE -->
<div id="pauseMenu" class="menu hidden">
    <div class="title">PAUSED</div>
    <button class="btn" id="resumeBtn">RESUME</button>
</div>

<!-- GAME OVER -->
<div id="gameOverMenu" class="menu hidden">
    <div class="title">GAME OVER</div>
    <button class="btn" id="restartBtn">RESTART</button>
</div>

<script>

/* =========================================================
   UTILITIES
========================================================= */

const gameEl = document.getElementById("game");

const rand = (min,max)=>Math.random()*(max-min)+min;

const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));

function distanceSquared(x1,y1,x2,y2){
    const dx = x2 - x1;
    const dy = y2 - y1;
    return dx*dx + dy*dy;
}

/* =========================================================
   INPUT
========================================================= */

const keys = {};
const mouse = {
    x:0,
    y:0,
    down:false
};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key === "Escape"){
        game.togglePause();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

window.addEventListener("mousemove",e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

window.addEventListener("mousedown",()=>{
    mouse.down = true;
});

window.addEventListener("mouseup",()=>{
    mouse.down = false;
});

/* =========================================================
   BASE ENTITY
========================================================= */

class Entity{

    constructor(x,y,size,cls){

        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.size = size;
        this.dead = false;

        this.el = document.createElement("div");
        this.el.className = `entity ${cls}`;

        gameEl.appendChild(this.el);
    }

    update(dt){}

    render(){

        this.el.style.transform =
            `translate3d(${this.x - this.size/2}px,
                         ${this.y - this.size/2}px,0)`;
    }

    destroy(){
        this.dead = true;
        this.el.remove();
    }
}

/* =========================================================
   PLAYER
========================================================= */

class Player extends Entity{

    constructor(){

        super(window.innerWidth/2,
              window.innerHeight/2,
              40,
              "player");

        this.speed = 360;
        this.health = 100;

        this.fireRate = 0.12;
        this.fireCooldown = 0;
    }

    update(dt){

        let mx = 0;
        let my = 0;

        if(keys["w"]) my -= 1;
        if(keys["s"]) my += 1;
        if(keys["a"]) mx -= 1;
        if(keys["d"]) mx += 1;

        const len = Math.hypot(mx,my);

        if(len){
            mx/=len;
            my/=len;
        }

        this.x += mx * this.speed * dt;
        this.y += my * this.speed * dt;

        this.x = clamp(this.x,20,window.innerWidth-20);
        this.y = clamp(this.y,20,window.innerHeight-20);

        this.fireCooldown -= dt;

        if(mouse.down && this.fireCooldown <=0){

            this.fireCooldown = this.fireRate;

            game.spawnBullet(this.x,this.y,
                             mouse.x,mouse.y);
        }
    }

    damage(amount){

        this.health -= amount;

        document.body.classList.add("flash");

        setTimeout(()=>{
            document.body.classList.remove("flash");
        },100);

        if(this.health <=0){
            game.gameOver();
        }
    }
}

/* =========================================================
   BULLET
========================================================= */

class Bullet extends Entity{

    constructor(x,y,targetX,targetY){

        super(x,y,10,"bullet");

        const angle = Math.atan2(targetY-y,targetX-x);

        this.speed = 900;

        this.vx = Math.cos(angle)*this.speed;
        this.vy = Math.sin(angle)*this.speed;

        this.life = 1.5;
    }

    update(dt){

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.life -= dt;

        if(this.life <=0){
            this.destroy();
        }
    }
}

/* =========================================================
   ENEMY
========================================================= */

class Enemy extends Entity{

    constructor(x,y,wave){

        super(x,y,36,"enemy");

        this.speed = 90 + wave * 8;
        this.health = 2 + wave * 0.4;
    }

    update(dt){

        const dx = game.player.x - this.x;
        const dy = game.player.y - this.y;

        const len = Math.hypot(dx,dy);

        this.x += dx/len * this.speed * dt;
        this.y += dy/len * this.speed * dt;

        const rr = (this.size + game.player.size)*0.5;

        if(distanceSquared(
            this.x,this.y,
            game.player.x,game.player.y
        ) < rr*rr){

            this.destroy();

            game.player.damage(10);

            game.shake(10);
        }
    }

    hit(){

        this.health--;

        if(this.health <=0){

            game.score += 10;

            game.createExplosion(this.x,this.y);

            this.destroy();
        }
    }
}

/* =========================================================
   PARTICLES
========================================================= */

class Particle extends Entity{

    constructor(x,y,color){

        super(x,y,6,"particle");

        this.life = rand(0.4,1);

        this.vx = rand(-250,250);
        this.vy = rand(-250,250);

        this.el.style.background = color;
        this.el.style.width = "6px";
        this.el.style.height = "6px";

        this.el.style.boxShadow = `0 0 10px ${color}`;
    }

    update(dt){

        this.life -= dt;

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        this.el.style.opacity = this.life;

        if(this.life <=0){
            this.destroy();
        }
    }
}

/* =========================================================
   GAME
========================================================= */

class Game{

    constructor(){

        this.entities = [];

        this.player = null;

        this.lastTime = 0;

        this.score = 0;

        this.wave = 1;

        this.spawnTimer = 0;

        this.paused = false;

        this.shakeAmount = 0;
    }

    start(){

        this.entities.forEach(e=>e.destroy());

        this.entities = [];

        this.score = 0;

        this.wave = 1;

        this.player = new Player();

        this.entities.push(this.player);

        this.paused = false;

        this.lastTime = performance.now();

        requestAnimationFrame(this.loop.bind(this));
    }

    loop(time){

        if(this.paused) return;

        const dt = (time - this.lastTime)/1000;

        this.lastTime = time;

        this.update(dt);

        this.render();

        requestAnimationFrame(this.loop.bind(this));
    }

    update(dt){

        this.spawnTimer -= dt;

        if(this.spawnTimer <=0){

            this.spawnTimer = Math.max(
                0.2,
                1 - this.wave*0.04
            );

            this.spawnEnemy();
        }

        this.wave += dt * 0.05;

        this.entities.forEach(e=>e.update(dt));

        this.handleCollisions();

        this.entities =
            this.entities.filter(e=>!e.dead);

        this.updateHUD();
    }

    render(){

        this.entities.forEach(e=>e.render());

        if(this.shakeAmount > 0){

            this.shakeAmount *= 0.9;

            const x = rand(-this.shakeAmount,
                            this.shakeAmount);

            const y = rand(-this.shakeAmount,
                            this.shakeAmount);

            gameEl.style.transform =
                `translate(${x}px,${y}px)`;

        }else{

            gameEl.style.transform = "";
        }
    }

    handleCollisions(){

        const bullets =
            this.entities.filter(e=>e instanceof Bullet);

        const enemies =
            this.entities.filter(e=>e instanceof Enemy);

        for(const bullet of bullets){

            for(const enemy of enemies){

                const rr =
                    (bullet.size + enemy.size)*0.5;

                if(distanceSquared(
                    bullet.x,bullet.y,
                    enemy.x,enemy.y
                ) < rr*rr){

                    bullet.destroy();

                    enemy.hit();

                    break;
                }
            }
        }
    }

    spawnBullet(x,y,tx,ty){

        const bullet =
            new Bullet(x,y,tx,ty);

        this.entities.push(bullet);

        this.createMuzzleFlash(x,y);
    }

    spawnEnemy(){

        const side = Math.floor(Math.random()*4);

        let x,y;

        if(side===0){
            x = rand(0,window.innerWidth);
            y = -50;
        }
        else if(side===1){
            x = window.innerWidth+50;
            y = rand(0,window.innerHeight);
        }
        else if(side===2){
            x = rand(0,window.innerWidth);
            y = window.innerHeight+50;
        }
        else{
            x = -50;
            y = rand(0,window.innerHeight);
        }

        const enemy =
            new Enemy(x,y,this.wave);

        this.entities.push(enemy);
    }

    createExplosion(x,y){

        for(let i=0;i<18;i++){

            const p =
                new Particle(x,y,"#ff0066");

            this.entities.push(p);
        }

        this.shake(6);
    }

    createMuzzleFlash(x,y){

        for(let i=0;i<5;i++){

            const p =
                new Particle(x,y,"#ffff00");

            this.entities.push(p);
        }
    }

    shake(amount){

        this.shakeAmount = amount;
    }

    updateHUD(){

        document.getElementById("score")
            .innerText =
            `Score: ${this.score}`;

        document.getElementById("health")
            .innerText =
            `Health: ${Math.max(0,this.player.health)}`;

        document.getElementById("wave")
            .innerText =
            `Wave: ${Math.floor(this.wave)}`;
    }

    togglePause(){

        if(!this.player) return;

        this.paused = !this.paused;

        document
            .getElementById("pauseMenu")
            .classList
            .toggle("hidden");

        if(!this.paused){

            this.lastTime = performance.now();

            requestAnimationFrame(
                this.loop.bind(this)
            );
        }
    }

    gameOver(){

        this.paused = true;

        document
            .getElementById("gameOverMenu")
            .classList
            .remove("hidden");
    }
}

/* =========================================================
   GAME INIT
========================================================= */

const game = new Game();

document.getElementById("startBtn")
.onclick = ()=>{

    document.getElementById("mainMenu")
    .classList.add("hidden");

    game.start();
};

document.getElementById("resumeBtn")
.onclick = ()=>{

    game.togglePause();
};

document.getElementById("restartBtn")
.onclick = ()=>{

    document
        .getElementById("gameOverMenu")
        .classList.add("hidden");

    game.start();
};

</script>
</body>
</html>
